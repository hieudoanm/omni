<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1e293b;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="brand" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0066FF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0039CC;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)" />

  <!-- omni logo mark: rounded box with ring -->
  <g transform="translate(80, 215)">
    <rect x="0" y="0" width="200" height="200" rx="32" ry="32" fill="url(#brand)" />
    <circle cx="100" cy="100" r="56" fill="none" stroke="#ffffff" stroke-width="12" />
    <circle cx="100" cy="100" r="22" fill="#ffffff" />
  </g>

  <g transform="translate(340, 290)">
    <text y="40" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="64" font-weight="700" fill="#f1f5f9" letter-spacing="-0.02em">omni</text>
    <text y="100" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="28" fill="#cbd5e1">Workspace · Everything in one place</text>
    <text y="150" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="24" fill="#94a3b8">Local-first • FastAPI • Next.js • Turbo</text>
  </g>
</svg>