name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Android: Linux runner with Android SDK
  android:
    name: Android
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /opt/android-sdk
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Setup JDK
        uses: actions/setup-java@v6.2.0
        with:
          distribution: temurin
          java-version: 25.0.5+8.0.LTS
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4.0.4
        with:
          api-level: 37
          ndk-version: r27c
          cmdline-tools-version: latest
      - name: Cache Gradle
        uses: actions/cache@v6.1.0
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('packages/mobile/android/**/*.kts', 'packages/mobile/android/**/*.toml') }}
          restore-keys: gradle-${{ runner.os }}-
      - name: Run Android lint
        run: make lint
        working-directory: packages/mobile/android
      - name: Run Android tests
        run: make test
        working-directory: packages/mobile/android
      - name: Build Android debug APK
        run: make build
        working-directory: packages/mobile/android
      - name: Upload Android APK
        uses: actions/upload-artifact@v7.0.2
        with:
          name: android-apk
          path: packages/mobile/android/app/build/outputs/apk/debug/*.apk
          retention-days: 7

  # macOS: macOS runner for Swift
  macos:
    name: macOS
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Run macOS format check
        run: make format-check
        working-directory: packages/desktop/macos
      - name: Run macOS lint (build)
        run: make lint
        working-directory: packages/desktop/macos
      - name: Run macOS tests
        run: make test
        working-directory: packages/desktop/macos
      - name: Build macOS release
        run: make build
        working-directory: packages/desktop/macos
      - name: Create macOS app bundle
        run: make app
        working-directory: packages/desktop/macos
      - name: Create macOS DMG
        run: make dmg
        working-directory: packages/desktop/macos
      - name: Zip macOS app for release
        run: |
          cd packages/desktop/macos/build
          zip -r Omni.app.zip Omni.app
      - name: Upload macOS app
        uses: actions/upload-artifact@v7.0.2
        with:
          name: macos-app
          path: |
            packages/desktop/macos/build/Omni.app.zip
            packages/desktop/macos/build/Omni-*.dmg
          retention-days: 7

  # CLI checks: fmt/clippy/test run once — duplicating them per build leg
  # would recompile the whole dep tree four times.
  cli-checks:
    name: CLI checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2.9.3
      - name: Rust CLI format check
        run: cargo fmt --check
        working-directory: packages/cli
      - name: Rust CLI lint
        run: cargo clippy --all-targets -- -D warnings
        working-directory: packages/cli
      - name: Rust CLI tests
        run: cargo test
        working-directory: packages/cli

  # CLI binaries: one leg per release target, built in parallel.
  # apple-darwin targets can only be linked on macOS; aarch64-linux needs
  # the gcc cross toolchain (Makefile sets the linker/cc/ar env itself).
  cli-build:
    name: CLI ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-amd64,  os: ubuntu-latest, target: x86_64-unknown-linux-gnu }
          - { name: linux-arm64,  os: ubuntu-latest, target: aarch64-unknown-linux-gnu, cross: true }
          - { name: darwin-amd64, os: macos-latest,  target: x86_64-apple-darwin }
          - { name: darwin-arm64, os: macos-latest,  target: aarch64-apple-darwin }
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2.9.3
      - name: Install aarch64 cross toolchain
        if: matrix.cross
        run: sudo apt-get install -y gcc-aarch64-linux-gnu
      - name: Build CLI ${{ matrix.name }}
        run: make build-all PLATFORMS="${{ matrix.target }}"
        working-directory: packages/cli
      - name: Upload CLI binary
        uses: actions/upload-artifact@v7.0.2
        with:
          name: cli-bin-${{ matrix.name }}
          path: packages/cli/bin/omni-${{ matrix.name }}
          retention-days: 7

  # Browser: Linux runner for Node.js
  browser:
    name: Browser
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Setup pnpm
        uses: pnpm/action-setup@v6.1.1
      - name: Setup Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
          cache: "pnpm"
          cache-dependency-path: pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: packages/extensions/browser
      - name: Run browser typecheck
        run: pnpm typecheck
        working-directory: packages/extensions/browser
      - name: Run browser lint
        run: pnpm lint:check
        working-directory: packages/extensions/browser
      - name: Run browser format check
        run: pnpm format:check
        working-directory: packages/extensions/browser
      - name: Run browser tests
        run: pnpm test
        working-directory: packages/extensions/browser
      - name: Build browser extension
        run: pnpm build
        working-directory: packages/extensions/browser
      - name: Prepare browser artifacts for release
        run: |
          mkdir -p packages/extensions/browser/release
          cp packages/extensions/browser/download/v2/omni.xpi packages/extensions/browser/release/omni-v2.xpi
          cp packages/extensions/browser/download/v2/omni.zip packages/extensions/browser/release/omni-v2.zip
          cp packages/extensions/browser/download/v3/omni.xpi packages/extensions/browser/release/omni-v3.xpi
          cp packages/extensions/browser/download/v3/omni.zip packages/extensions/browser/release/omni-v3.zip
      - name: Upload browser build
        uses: actions/upload-artifact@v7.0.2
        with:
          name: browser-extension
          path: packages/extensions/browser/release
          retention-days: 7

  # Rolling release: on push to master, update the "latest" GitHub Release
  release-latest:
    name: Release (latest)
    needs: [android, macos, cli-checks, cli-build, browser, landing-build]
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Read release notes from README.md
        id: readme
        run: |
          echo "body<<EOF" >> $GITHUB_OUTPUT
          cat README.md >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
      - name: Download CLI binaries
        uses: actions/download-artifact@v8.0.2
        with:
          pattern: cli-bin-*
          path: dist/cli
          merge-multiple: true
      - name: Download Android APK
        uses: actions/download-artifact@v8.0.2
        with:
          name: android-apk
          path: dist/android
      - name: Download macOS app
        uses: actions/download-artifact@v8.0.2
        with:
          name: macos-app
          path: dist/macos
      - name: Download browser extension
        uses: actions/download-artifact@v8.0.2
        with:
          name: browser-extension
          path: dist/browser
      - name: List artifacts to verify
        run: |
          echo "=== CLI ===" && ls -la dist/cli/
          echo "=== Android ===" && ls -la dist/android/
          echo "=== macOS ===" && ls -la dist/macos/
          echo "=== Browser ===" && ls -la dist/browser/
      - name: Delete existing "latest" release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          git push origin :refs/tags/latest || true
      - name: Create/Update "latest" Release
        uses: softprops/action-gh-release@v3.0.4
        with:
          tag_name: latest
          name: "Omni (latest)"
          body: ${{ steps.readme.outputs.body }}
          files: |
            dist/cli/omni-linux-amd64
            dist/cli/omni-linux-arm64
            dist/cli/omni-darwin-amd64
            dist/cli/omni-darwin-arm64
            dist/android/app-debug.apk
            dist/macos/Omni.app.zip
            dist/macos/Omni-*.dmg
            dist/browser/omni-v2.xpi
            dist/browser/omni-v2.zip
            dist/browser/omni-v3.xpi
            dist/browser/omni-v3.zip
          draft: false
          prerelease: false
          make_latest: true

  # Web: Linux runner for Next.js
  landing-build:
    name: Landing - Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Setup pnpm
        uses: pnpm/action-setup@v6.1.1
      - name: Setup Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
          cache: "pnpm"
          cache-dependency-path: pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: packages/web
      - name: Typecheck web
        run: pnpm typecheck
        working-directory: packages/web
      - name: Lint web
        run: pnpm lint
        working-directory: packages/web
      - name: Test web
        run: pnpm test
        working-directory: packages/web
      - name: Build web
        run: pnpm build
        working-directory: packages/web
      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/master'
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: packages/web/out

  # Deploy to GitHub Pages
  landing-deploy:
    name: Landing - Deploy
    needs: [landing-build]
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5.0.1
