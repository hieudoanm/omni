name: Omni
options:
  bundleIdPrefix: io.github.hieudoanm.omni
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    MARKETING_VERSION: "0.0.1"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "6.0"
targets:
  Omni:
    type: application
    platform: iOS
    sources:
      - path: Omni
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.hieudoanm.omni.ios
        INFOPLIST_FILE: Omni/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: Omni/Omni.entitlements
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_EMIT_LOC_STRINGS: YES
  OmniTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: OmniTests
    dependencies:
      - target: Omni
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.hieudoanm.omni.ios.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Omni.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/Omni"
        BUNDLE_LOADER: "$(TEST_HOST)"
        SWIFT_EMIT_LOC_STRINGS: NO
schemes:
  Omni:
    build:
      targets:
        Omni: all
        OmniTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - OmniTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
