[package]
name = "omni"
version = "0.0.1"
edition = "2021"
description = "Omni CLI - a personal CLI toolbox"
license = "MIT"

[[bin]]
name = "omni"
path = "src/main.rs"

[dependencies]
anyhow = "=1.0.104"
base64 = "=0.23.1"
chrono = { version = "=0.4.45", features = ["clock"] }
clap = { version = "=4.6.7", features = ["derive"] }
clap_complete = "=4.6.11"
dirs = "=5.0.1"
rand = "=0.10.3"
num-bigint = "=0.5.1"
ctrlc = "=3.5.2"
chrono-tz = "=0.10.4"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
serde_yml = "=0.0.13"
unicode_categories = "=0.1.1"
unicode-normalization = "=0.1.26"
ureq = { version = "=3.5.2", features = ["json"] }
regex = "=1.13.1"
csv = "=1.4.0"
zip = "=9.5.1"
quick-xml = "=0.42.0"
sysinfo = "=0.40.3"
rusqlite = { version = "=0.42.0", features = ["bundled"] }
scraper = "=0.29.0"
calamine = "=0.38.0"
x509-parser = "=0.18.1"
sha2 = "=0.11.1"
hex = "=0.4.3"
md-5 = "=0.11.0"
sha1 = "=0.11.0"
rustls = "=0.23.46"
rustls-pemfile = "=2.2.0"
tree-sitter = "=0.27.2"
tree-sitter-go = "=0.25.0"
aes-gcm = "=0.11.1"
hmac = "=0.13.0"
uuid = { version = "=1.29.2", features = ["v4"] }
qrcode = "=0.14.1"
rqrr = "=0.11.0"
rsa = "=0.10.0"
p256 = "=0.14.0"
p384 = "=0.14.0"
ed25519-dalek = { version = "=3.0.0", features = ["pkcs8", "rand_core", "pem"] }
pkcs8 = { version = "=0.11.0", features = ["pem"] }
sec1 = "=0.8.1"
pkcs1 = "=0.8.0"
spki = { version = "=0.8.1", features = ["pem"] }
image = "=0.25.8"
rxing = "=0.9.4"
p521 = "=0.14.0"
ecdsa = "=0.17.0"
elliptic-curve = "=0.14.3"
imageproc = "=0.27.0"
headless_chrome = "=1.0.22"
html2md = "=0.2.17"
readability-rust = "=0.1.0"
shakmaty = "=0.30.2"
lopdf = "=0.47.0"
hayro = "=0.9.0"
hayro-syntax = "=0.9.0"
hayro-interpret = "=0.9.0"
flate2 = "=1.1.11"
ratatui = "=0.30.2"
crossterm = "=0.29.0"
termimad = "=0.35.5"
ansi-to-tui = "=8.0.1"

[profile.release]
lto = true
strip = true
